name: Build and Deploy Presentation

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - presentation/**
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Presentation
        working-directory: ./presentation
        run: quarto render presentation.qmd

      - name: Prepare Deployment Directory
        working-directory: ./presentation
        run: |
          mkdir -p public/
          cp *.html public/
          
          # Copy assets and custom CSS if they exist
          if [ -d "assets" ]; then
            cp -r assets public/
          fi
          if [ -f "custom.css" ]; then
            cp custom.css public/
          fi
          
          echo "Files being deployed:"
          ls -R public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/public
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
          